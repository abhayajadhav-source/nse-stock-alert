name: NSE Stock News Alert Scanner

# Runs every 5 minutes during NSE market hours (Mon-Fri, 03:30-10:15 UTC = 09:00-15:45 IST)

on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside market hours (for testing)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      test_email:
        description: "Send a test email only (skip scan)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore alert-state cache
        uses: actions/cache@v4
        with:
          path: data/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run scanner
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT:    ${{ secrets.GMAIL_RECIPIENT }}
          PYTHONUNBUFFERED:   "1"
        run: |
          cd src
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python main.py --test-email
          elif [ "${{ github.event.inputs.force_run }}" = "true" ]; then
            python main.py --force
          else
            python main.py
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs-${{ github.run_id }}
          path: |
            data/
            *.log
          retention-days: 7
